version: '3.8'

services:
  # Main ChatPPT application
  chatppt-app:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: chatppt-app
    ports:
      - "7860:7860"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    volumes:
      - ./output:/app/output
      - ./images:/app/images
      - ./logs:/app/logs
      - ./inputs:/app/inputs
      - ./models:/app/models
    restart: unless-stopped
    networks:
      - chatppt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ChatPPT with GPU support (uncomment if GPU available)
